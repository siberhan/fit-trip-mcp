<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fit Trip MCP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --bg:#101219;--bg2:#1b1e2b;--panel:#1d2130;--raise:#242939;--line:#262b3b;--line2:#343a4e;
  --fg:#ebebf0;--muted:#9a9eb0;--faint:#71768a;
  --dev:#4a9fd4;--dev-soft:rgba(74,159,212,.12);--mcp:#d4a284;--mcp-soft:rgba(212,162,132,.11);
  --good:#7fb8de;--poor:#e0605a;--gold:#e8d3a2;--gold-soft:rgba(232,211,162,.1);--glass:linear-gradient(180deg,#1f2332,#1a1d29);--edge:rgba(255,255,255,.08);
  --display:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;--screen:"Noto Sans Bengali",ui-sans-serif,system-ui,sans-serif;--font:"Inter",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
html{background:var(--bg)}
body{background:radial-gradient(ellipse 80% 70% at 45% 40%,#1c1f2b 0%,#14161f 55%,var(--bg) 90%) fixed;color:var(--fg);font:14px/1.45 var(--font);overflow-x:hidden}
::selection{background:rgba(212,162,132,.28)}
:focus-visible{outline:2px solid var(--mcp);outline-offset:2px}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:disabled{cursor:default;opacity:.45}
svg.lucide{width:16px;height:16px;stroke-width:1.75;flex:none}
.mono{font-family:var(--mono)}

/* ---- Top bar ---- */
.top{position:relative;z-index:2;display:flex;align-items:center;gap:18px;padding:12px 24px;border-bottom:1px solid var(--line);background:rgba(6,10,13,.85);backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:10px;font:600 17px var(--display);letter-spacing:-.01em}
.brand svg{width:22px;height:22px}
.conn{display:flex;align-items:center;gap:7px;font:12px var(--mono);color:var(--muted)}
.led{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.conn.on .led{background:var(--mcp)}
.faces{display:flex}
.faces{flex:none}
.faces .av{width:24px;height:24px;margin-left:-8px;border:2px solid #0c1a1d}
.faces .av:first-child{margin-left:0}

/* ---- Stage ---- */
.stage{position:relative;display:grid;grid-template-columns:minmax(640px,2.6fr) minmax(96px,.28fr) minmax(300px,.9fr) 210px;gap:0;padding:22px 24px 28px;min-height:calc(100vh - 59px)}

/* Device */
.device-col{display:flex;flex-direction:column;gap:14px;min-width:0}
.device{position:relative;background:#0a0b0f;border:1px solid #6d717c;border-radius:12px;padding:14px;box-shadow:0 30px 60px -24px rgba(0,0,0,.75),inset 0 0 0 2px #1a1c22}
.device .cam{position:absolute;top:8px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#1b2428;box-shadow:inset 0 0 0 1px #2a363b}
.screen{position:relative;aspect-ratio:16/10;max-height:calc(100vh - 230px);border-radius:3px;background:var(--bg2);overflow:hidden;display:flex;flex-direction:column;box-shadow:inset 0 0 0 1px #0f171b}
.sbar{display:flex;align-items:center;gap:10px;padding:10px 16px;font:12px var(--mono);color:var(--muted);border-bottom:1px solid var(--line)}
.sbar .who{display:flex;align-items:center;gap:7px;color:var(--dev)}
.sbar .who i{width:7px;height:7px;border-radius:50%;background:var(--dev)}
.sbar.live .who i{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.sbar #status-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbar #clock{font-variant-numeric:tabular-nums}
.sscroll{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0}
/* The screen reads like a smart display: the assistant's latest line in large type.
   Once a card is up, the screen splits: the words on the left, the card on the right. */
.sscroll:has(.turn:not([hidden])){display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);overflow:hidden}
#sscroll.split{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr)}
.sscroll .turn{height:100%;display:flex;flex-direction:column;padding:22px 26px 22px}
.sscroll.split .turn{padding:18px 8px 18px 22px}
#convo .bub{max-width:100%;padding:0;background:none;border:0;border-radius:0}
/* Only the assistant's latest line is on screen, like a smart display; what the user said is not echoed back. */
#convo .bub:has(~ .bub.me),#convo .bub.bot:has(~ .bub.bot){display:none}
#convo .bub{transition:opacity .45s var(--ease),transform .45s var(--ease)}
#convo .bub.out{opacity:0;transform:translateY(-6px)}
#convo .bub.new{animation:none}
#convo .bub .w{display:inline-block;white-space:pre;animation:wordIn .6s var(--ease) both}
.sscroll .bub.me{align-self:flex-start;background:none;border:0;font:400 17px/1.4 var(--screen);color:var(--muted);margin-bottom:14px;animation:msgIn .6s var(--ease) both}
.sscroll.split .bub.me{font-size:15px;margin-bottom:10px}
@keyframes wordIn{from{opacity:0;transform:translateY(5px);filter:blur(3px)}}
.sscroll .convo{flex:1;height:auto;justify-content:flex-start;-webkit-mask-image:none;mask-image:none}
.sscroll .bub.bot{font:400 26px/1.32 var(--screen);letter-spacing:0;color:var(--fg)}
.sscroll.split .bub.bot{font-size:20px;line-height:1.36}
.sscroll .rcol{overflow-y:auto;min-height:0;padding-top:6px}
.sscroll:not(.split) .rcol{display:none}
.sscroll.split .slot{margin:12px 14px 14px 6px}
.vorb{display:block;flex:none;width:34px;height:34px;margin-top:auto;border-radius:50%;border:2px solid var(--mcp);background:transparent}
body.talking .vorb{animation:vorb 1.1s ease-in-out infinite}
@keyframes vorb{50%{transform:scale(1.15);background:rgba(212,162,132,.25)}}
.idle{height:100%;display:grid;place-content:center;justify-items:center;gap:10px;text-align:center;padding:24px}
.idle .t{font:500 72px/1 var(--screen);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.idle .d{color:var(--muted);font-size:15px}
.idle .try{margin-top:22px;font:500 18px var(--screen);color:var(--fg);opacity:.85}
.turn{padding:12px 18px 4px;width:100%;box-sizing:border-box}
.convo{width:100%;height:132px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 34px);mask-image:linear-gradient(transparent,#000 34px)}
.bub{display:block;flex:none;width:fit-content;max-width:86%;box-sizing:border-box;margin:0;padding:7px 12px;border-radius:14px;font-size:14px;line-height:1.4;text-wrap:pretty}
.bub.me{align-self:flex-end;color:var(--fg);background:var(--glass);border:1px solid var(--line2);border-bottom-right-radius:4px}
.bub.bot{align-self:flex-start;color:var(--fg);background:var(--dev-soft);border:1px solid rgba(74,159,212,.28);border-bottom-left-radius:4px;font:500 15px/1.4 var(--display)}
.bub.err{color:#ffb4a8;border-color:rgba(255,140,120,.35);background:rgba(255,120,100,.08)}
.bub.new{animation:msgIn .35s var(--ease) both}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}}
.slot{position:relative;margin:10px 12px 14px;min-height:72px}

.slot .tag{position:absolute;top:-9px;left:12px;padding:0 6px;background:var(--bg2);font:11px var(--mono);color:var(--faint);letter-spacing:.03em}
.slot.on .tag{color:var(--mcp)}
.slot iframe{display:block;width:100%;height:0;border:0;border-radius:3px}
.base{display:none}

.controls{display:grid;gap:10px}
.ask{display:flex;gap:10px;align-items:center}
.talk{position:relative;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--dev-soft);border:1px solid rgba(74,159,212,.4);color:var(--dev);transition:background .2s}
.talk svg.lucide{width:20px;height:20px}
.talk{touch-action:none;user-select:none;-webkit-user-select:none}
.talk.on{background:var(--dev);color:#06121f;transform:scale(1.08)}
.talk.on::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1px solid var(--dev);animation:ring 1.6s var(--ease) infinite}
@keyframes ring{from{transform:scale(.9);opacity:1}to{transform:scale(1.25);opacity:0}}
.field{flex:1;min-width:0;display:flex;align-items:center;height:48px;border-radius:24px;border:1px solid var(--edge);background:var(--glass);padding:0 6px 0 14px;transition:border-color .2s}
.field:focus-within{border-color:rgba(74,159,212,.55)}
.field input{flex:1;min-width:0;background:none;border:0;color:var(--fg);font:15px var(--font);outline:none;caret-color:var(--dev)}
.field input::placeholder{color:var(--faint)}
.send{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--dev);color:#06121f}
.iconbtn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line2);color:var(--muted)}
.iconbtn[aria-pressed=false]{color:var(--faint)}
#type[aria-pressed=true]{color:var(--dev);border-color:rgba(74,159,212,.45)}
.field[hidden],.hint[hidden]{display:none}
.hint{flex:none;display:flex;align-items:center;gap:7px;font-size:14px;color:var(--muted)}
.hint kbd{font:600 12px var(--mono);color:var(--fg);padding:3px 9px 4px;border-radius:7px;border:1px solid var(--line2);border-bottom-width:2px;background:var(--glass)}
.hint.on{color:var(--dev)}
.hint.on kbd{border-color:var(--dev);color:var(--dev)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font-size:12.5px;padding:6px 11px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);transition:color .2s,border-color .2s}
.chips button:hover:not(:disabled){color:var(--fg);border-color:var(--faint)}

/* Circuit */
.wire{position:relative;min-width:0}
#wires{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#wires path{fill:none;stroke:url(#wg);stroke-width:1.1;opacity:.75;transition:stroke .3s,opacity .3s}
#wires path.hot{stroke:var(--gold);stroke-width:1.6;opacity:1;stroke-dasharray:6 5;animation:flow .6s linear infinite}
#wires path.back{stroke:rgba(212,162,132,.7)}
#wires path.dim{opacity:.18}
#wires circle.end{fill:var(--gold);opacity:.8}
@keyframes flow{to{stroke-dashoffset:-10}}
#wires circle.p{filter:none}
.agent{position:absolute;left:-24px;width:128px;transform:translateY(-50%);display:grid;justify-items:center;gap:6px;text-align:center;z-index:1}
.orb{position:relative;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:#24577c;border:1px solid rgba(74,159,212,.55);color:var(--dev);transition:transform .3s var(--ease)}
.orb svg.lucide{width:26px;height:26px;color:#eaf2ff}
.agent.busy .orb::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px dashed rgba(74,159,212,.6);animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.agent:hover .orb{transform:scale(1.06)}
.agent b{font:600 12.5px var(--display);color:var(--fg)}
.agent small{display:block;font:11px var(--mono);color:var(--muted)}

/* Server */
.server{display:flex;flex-direction:column;gap:12px;min-width:0}
.srv{border:1px solid var(--edge);border-radius:18px;background:var(--glass);box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 24px 50px -30px #000}
.srv-head{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;text-align:left;border-bottom:1px solid var(--line)}
.srv-head .glyph{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--mcp-soft);color:var(--mcp);border:1px solid rgba(212,162,132,.35)}
.srv-head b{display:block;font:600 15px var(--display)}
.srv-head small{display:block;font:11px var(--mono);color:var(--muted)}
.srv-head .go{margin-left:auto;color:var(--faint)}
.ports{list-style:none;margin:0;padding:6px 0}
.ports{padding:8px 10px 10px 0}
.port{position:relative;width:100%;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:7px 12px 7px 20px;margin-left:0;text-align:left;border:1px solid transparent;border-radius:10px;transition:background .2s,border-color .3s}
.port::before{content:"";position:absolute;left:-5px;top:50%;width:9px;height:9px;margin-top:-5px;border-radius:50%;background:var(--bg);border:1.5px solid var(--line2);transition:border-color .2s,background .2s}
.port:hover{background:rgba(255,255,255,.02)}
.port .nm{font:12.5px var(--mono);color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.port .st{font:11px var(--mono);color:var(--faint);font-variant-numeric:tabular-nums}
.port.hot{border-color:var(--gold);background:linear-gradient(90deg,var(--gold-soft),rgba(232,211,162,.02))}
.port.hot::before{border-color:var(--gold);background:var(--gold)}
.port.hot .nm{color:var(--gold)}
.port.sel{border-color:rgba(232,211,162,.45)}
.port.done::before{border-color:var(--gold);background:var(--bg)}
.port.done .st{color:var(--mcp)}
.port.ui .nm::after{content:"ui";margin-left:8px;padding:0 5px;border-radius:4px;font-size:11px;color:var(--mcp);border:1px solid rgba(212,162,132,.35)}

.research{border:1px solid var(--edge);border-radius:18px;background:var(--glass);box-shadow:inset 0 1px 0 rgba(255,255,255,.04);overflow:hidden;transition:border-color .3s}
.research.busy{border-color:rgba(212,162,132,.4)}
.rhead{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left}
.rorb svg.lucide{color:#eafff8}
.rorb{position:relative;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 36% 30%,#9ff3dc 0%,#2bb08c 25%,#0d3b31 60%,#06181a 85%);border:1px solid rgba(212,162,132,.5);color:var(--mcp);flex:none}
.research.busy .rorb::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1px dashed rgba(212,162,132,.6);animation:spin 5s linear infinite}
.rhead .txt{flex:1;min-width:0}
.rhead b{display:block;font:600 14px var(--display)}
.rhead #r-now{display:block;font:11.5px var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtick{margin:0;padding:0 16px 12px;min-height:16px;font:11.5px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtick:empty{display:none}
.rhead .chev{color:var(--faint);transition:transform .3s var(--ease)}
.research.open .chev{transform:rotate(180deg)}
.rbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}
.research.open .rbody{grid-template-rows:1fr}
.rbody>div{overflow:hidden}
/* Pipeline: one node per research stage, the count is the only text that changes */
.stages{list-style:none;margin:0;padding:4px 14px 14px;display:grid;grid-template-columns:repeat(5,1fr);position:relative}
.stages::before{content:"";position:absolute;left:calc(10% + 14px);right:calc(10% + 14px);top:19px;height:1px;background:var(--line2)}
.stages li{position:relative;display:grid;justify-items:center;gap:5px;text-align:center}
.stages .dot{position:relative;z-index:1;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--bg2);border:1px solid var(--line2);font:600 12px var(--mono);color:var(--faint);font-variant-numeric:tabular-nums;transition:border-color .3s,color .3s,background .3s,transform .3s var(--ease)}
.stages .lbl{font:11px var(--mono);color:var(--faint);letter-spacing:.02em}
.stages li.done .dot{border-color:rgba(212,162,132,.55);color:var(--mcp)}
.stages li.done .lbl{color:var(--muted)}
.stages li.now .dot{border-color:var(--gold);color:var(--gold);background:var(--gold-soft);transform:scale(1.12)}
.stages li.now .lbl{color:var(--gold)}
.stages li.bump .dot{animation:bump .4s var(--ease)}
@keyframes bump{50%{transform:scale(1.28)}}
.rgroups{display:grid;gap:2px;padding:0 10px 12px;border-top:1px solid var(--line);padding-top:10px}
.rg{display:grid;grid-template-columns:68px 1fr;gap:10px;align-items:center;padding:5px 6px;border-radius:8px}
.rg .k{font:600 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.rg .chips2{display:flex;gap:4px;overflow:hidden;white-space:nowrap;mask-image:linear-gradient(90deg,#000 85%,transparent)}
.rg .chips2 span{flex:none;font:11.5px var(--font);padding:2px 8px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);color:var(--fg)}
.rg .chips2 span.ok{border-color:rgba(212,162,132,.4)}
.rg .chips2 span.limited{border-color:rgba(242,184,75,.45)}
.rg .chips2 span.no{border-color:rgba(255,107,94,.45)}
.rg .chips2 span.great{color:var(--mcp)} .rg .chips2 span.good{color:var(--good)} .rg .chips2 span.poor{color:var(--poor)}
.rg .chips2 span.q{font-family:var(--mono);font-size:11px;color:var(--muted)}

/* Household data: where the MCP server's profile and memory tools read from and write to */
.data{display:flex;flex-direction:column;gap:12px;padding:110px 0 0 40px;min-width:0}
.dnode{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:1px solid var(--edge);background:var(--glass);text-align:left;box-shadow:inset 0 1px 0 rgba(255,255,255,.05);transition:border-color .3s,transform .3s var(--ease)}
.dnode:hover{border-color:var(--gold)}
.dnode.flash{border-color:var(--gold);transform:translateX(-3px)}
.dnode .dic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold);flex:none}
.dnode .dtx{min-width:0}
.dnode b{display:block;font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dnode small{display:block;font:11px var(--mono);color:var(--muted)}
#flow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#flow path{fill:none;stroke:rgba(232,211,162,.28);stroke-width:1;stroke-dasharray:2 4;transition:stroke .3s}
#flow path.hot{stroke:var(--gold);stroke-dasharray:none}
#flow circle{fill:var(--gold);opacity:.7}
#flow .pkt rect{fill:#e8d3a2}
#flow .pkt path{fill:none;stroke:#0b1518;stroke-width:1.1;stroke-dasharray:none}

/* Drawer *//* Drawer */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(3,6,8,.45);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:21;width:min(460px,100vw);background:var(--panel);border-left:1px solid var(--line2);transform:translateX(102%);transition:transform .45s var(--ease);display:flex;flex-direction:column;box-shadow:-30px 0 60px -30px rgba(0,0,0,.9)}
.drawer.on{transform:none}
.dhead{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.dhead h2{margin:0;font:600 18px var(--display);flex:1;min-width:0}
.dhead .sw{width:10px;height:10px;border-radius:50%}
.dbody{flex:1;overflow-y:auto;padding:18px 20px 30px;display:grid;gap:20px;align-content:start}
.dbody h3{margin:0 0 8px;font:500 11px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.dbody p{margin:0;color:var(--muted);line-height:1.55}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--mono);font-size:12.5px;word-break:break-word}
pre.json{margin:0;padding:10px 12px;border-radius:8px;background:var(--bg);border:1px solid var(--line);font:11.5px/1.5 var(--mono);color:#b9cbc6;white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto}
.msgs{display:grid;gap:5px}
.msg{display:grid;grid-template-columns:18px 1fr;gap:6px;font:11.5px/1.45 var(--mono);color:#b9cbc6;padding:6px 8px;border-radius:6px;background:var(--bg);word-break:break-word}
.msg .d{color:var(--dev)}
.msg.in .d{color:var(--mcp)}
.chat{display:grid;gap:8px}

<script>
// Every browser gets its own demo family, so one visitor's changes never show up for another.
const household = (() => {
  const fresh = "demo-" + crypto.randomUUID().slice(0, 8);
  try { return localStorage.getItem("household") || (localStorage.setItem("household", fresh), fresh); } catch { return fresh; }
})();
const session = crypto.randomUUID();
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const icon = (name) => { const i = el("i"); i.dataset.lucide = name; return i; };
const icons = () => window.lucide?.createIcons();
const fmtJson = (o) => JSON.stringify(o, null, 2);
const clip = (s, n = 600) => (s.length > n ? s.slice(0, n) + "…" : s);

function status(text, live = false) { $("status-text").textContent = text; $("sbar").classList.toggle("live", live); }
function tick() {
  const d = new Date();
  $("clock").textContent = d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
  $("big-clock").textContent = d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }).replace(/ [AP]M/, "");
  $("big-date").textContent = d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
}
tick(); setInterval(tick, 10000);

// ---- Traffic: every JSON-RPC message, for the drawers and the circuit ----
const traffic = [];
const toolState = new Map(); // name -> { calls, last: {args, result, ms}, started }
function record(dir, body, tool) {
  traffic.push({ dir, body, tool, t: Date.now() });
  if (traffic.length > 300) traffic.shift();
  if (drawerFor === "server" || drawerFor === "tool:" + tool) openDrawer(drawerFor, true);
}

// ---- MCP client over Streamable HTTP (the device app's own calls) ----
let rpcId = 1;
async function mcp(method, params, onNotify) {
  const id = rpcId++;
  const tool = method === "tools/call" ? params.name : "_session";
  record("→", { jsonrpc: "2.0", id, method, params }, tool);
  callStart(tool, params?.arguments);
  const res = await fetch("/mcp", {
    method: "POST",
    headers: { "Content-Type": "application/json", Accept: "application/json, text/event-stream", "x-household": household, "MCP-Protocol-Version": "2025-11-25" },
    body: JSON.stringify({ jsonrpc: "2.0", id, method, params }),
  });
  if (!res.ok) throw new Error(`MCP HTTP ${res.status}`);
  const handle = (m) => {
    record("←", m, tool);
    if (m.id === id) { callEnd(tool, m.result); return m; }
    onNotify?.(m); pulse(tool, "back", 3); return null;
  };
  if ((res.headers.get("content-type") || "").includes("application/json")) {
    const m = handle(await res.json());
    if (m.error) throw new Error(m.error.message);
    return m.result;
  }
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0) {
      const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
      const data = chunk.split("\n").filter((l) => l.startsWith("data:")).map((l) => l.slice(5).trim()).join("\n");
      if (!data) continue;
      const m = handle(JSON.parse(data));
      if (m) { reader.cancel().catch(() => {}); if (m.error) throw new Error(m.error.message); return m.result; }
    }
  }
  throw new Error("MCP stream ended without a result");
}
async function notify(method, params) {
  record("→", { jsonrpc: "2.0", method, params }, "_session");
  pulse("_session", "out");
  await fetch("/mcp", { method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json, text/event-stream", "x-household": household }, body: JSON.stringify({ jsonrpc: "2.0", method, params }) });
}

let tools = [], cardHtml = "", uiTools = new Set(), serverInfo = null, instructions = "";
async function connect() {
  const init = await mcp("initialize", {
    protocolVersion: "2025-11-25",
    capabilities: { extensions: { "io.modelcontextprotocol/ui": { mimeTypes: ["text/html;profile=mcp-app"] } } },
    clientInfo: { name: "outing-fit-device", version: "0.2.0" },
  });
  serverInfo = init.serverInfo; instructions = init.instructions || "";
  await notify("notifications/initialized");
  tools = (await mcp("tools/list", {})).tools;
  uiTools = new Set(tools.filter((t) => t._meta?.ui?.resourceUri).map((t) => t.name));
  buildPorts();
  const uri = tools.find((t) => t._meta?.ui?.resourceUri)?._meta.ui.resourceUri;
  if (uri) cardHtml = (await mcp("resources/read", { uri })).contents[0].text;
  $("conn").classList.add("on");
  $("conn-text").textContent = `${serverInfo.name} · ${tools.length} tools`;
  status("Ready");
  await loadHousehold();
  await loadMemory();
}

// ---- Circuit: one wire from the device agent to every MCP tool, pulses for each message ----
function buildPorts() {
  const ul = $("ports"); ul.replaceChildren();
  const add = (name, label, cls = "") => {
    const li = el("li"); const b = el("button", "port " + cls); b.dataset.tool = name;
    b.append(el("span", "nm", label), el("span", "st", ""));
    b.onclick = () => openDrawer("tool:" + name);
    li.append(b); ul.append(li);
  };
  add("_session", "initialize · tools/list");
  for (const t of tools) add(t.name, t.name, uiTools.has(t.name) ? "ui" : "");
  drawWires(); drawFlow();
}
const portEl = (name) => document.querySelector(`.port[data-tool="${CSS.escape(name)}"]`);
function drawWires() {
  const svg = $("wires"); const box = svg.getBoundingClientRect();
  if (!box.width) return;
  // The wires leave straight from the device's edge.
  const dev = document.querySelector(".device").getBoundingClientRect();
  const x0 = dev.right - box.left, y0 = dev.top + dev.height * .4 - box.top;
  const ns = "http://www.w3.org/2000/svg";
  svg.innerHTML = '<defs><linearGradient id="wg" gradientUnits="userSpaceOnUse" x1="0" x2="' + box.width + '" y1="0" y2="0"><stop offset="0" stop-color="#4a9fd4"/><stop offset=".55" stop-color="#d4a284" stop-opacity=".55"/><stop offset="1" stop-color="#e8d3a2" stop-opacity=".7"/></linearGradient></defs>';
  for (const b of document.querySelectorAll(".port")) {
    const r = b.getBoundingClientRect();
    const x1 = r.left - box.left - 5, y1 = r.top + r.height / 2 - box.top;
    const p = document.createElementNS(ns, "path");
    const mx = x0 + (x1 - x0) * 0.55;

// Household data nodes: a dotted line from each one to every tool that reads or writes it.

const WRITES = new Set(["update_family_profile", "set_max_drive", "log_visit", "save_visit_review"]);

  if ("speechSynthesis" in window) await new Promise((done) => { const u = new SpeechSynthesisUtterance(text); u.onend = u.onerror = done; speechSynthesis.speak(u); });
}
$("voice").onclick = () => {
  voiceOn = !voiceOn; $("voice").setAttribute("aria-pressed", voiceOn);
  $("voice").replaceChildren(icon(voiceOn ? "volume-2" : "volume-x")); icons();
  if (!voiceOn) { speaking?.pause(); speechSynthesis?.cancel(); }
};

// ---- Voice in: hold the mic button to talk, release to send ----
// Raw samples are captured while the button is held, downsampled to 16 kHz mono and sent as WAV to /api/stt.
let micStream = null, actx = null, chunks = null, held = false;
async function ensureMic() {
  if (micStream) return;
  micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 } });
  actx = new AudioContext();
  const src = actx.createMediaStreamSource(micStream), node = actx.createScriptProcessor(4096, 1, 1);
  node.onaudioprocess = (e) => { if (chunks) chunks.push(new Float32Array(e.inputBuffer.getChannelData(0))); };
  src.connect(node); node.connect(actx.destination);
}
function toWav(parts, rate) {
  const all = new Float32Array(parts.reduce((n, p) => n + p.length, 0));
  let o = 0; for (const p of parts) { all.set(p, o); o += p.length; }
  const ratio = rate / 16000, n = Math.floor(all.length / ratio);
  const buf = new DataView(new ArrayBuffer(44 + n * 2));
  const str = (i, t) => [...t].forEach((ch, j) => buf.setUint8(i + j, ch.charCodeAt(0)));
  str(0, "RIFF"); buf.setUint32(4, 36 + n * 2, true); str(8, "WAVEfmt "); buf.setUint32(16, 16, true);
  buf.setUint16(20, 1, true); buf.setUint16(22, 1, true); buf.setUint32(24, 16000, true); buf.setUint32(28, 32000, true);
  buf.setUint16(32, 2, true); buf.setUint16(34, 16, true); str(36, "data"); buf.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) {
    let sum = 0, c = 0;
    for (let j = Math.floor(i * ratio); j < Math.floor((i + 1) * ratio); j++) { sum += all[j]; c++; }
    const v = Math.max(-1, Math.min(1, sum / (c || 1)));
    buf.setInt16(44 + i * 2, v < 0 ? v * 0x8000 : v * 0x7fff, true);
  }
  return buf.buffer;
}
async function micDown(e) {
  e.preventDefault();
  if (busy || held) return;
  held = true;
  speaking?.pause(); speechSynthesis?.cancel();
  $("mic").classList.add("on"); $("mic").setAttribute("aria-pressed", "true"); $("hint").classList.add("on");
  try { await ensureMic(); await actx.resume(); }
  catch (err) { held = false; $("mic").classList.remove("on"); $("hint").classList.remove("on"); status("Microphone unavailable: " + err.message); return; }
  if (!held) return;
  chunks = [];
  status("Listening · release to send", true);
}
async function micUp() {
  if (!held) return;
  held = false;
  $("mic").classList.remove("on"); $("mic").setAttribute("aria-pressed", "false"); $("hint").classList.remove("on");
  const parts = chunks; chunks = null;
  if (!parts || parts.reduce((n, p) => n + p.length, 0) < actx.sampleRate * 0.4) { status("Ready"); return; }
  status("Transcribing", true);
  try {
    const r = await fetch("/api/stt", { method: "POST", headers: { "Content-Type": "audio/wav" }, body: toWav(parts, actx.sampleRate) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    if (d.text) await ask(d.text); else status("Didn’t catch that");
  } catch (err) { status("Could not transcribe: " + err.message); }
}
$("mic").addEventListener("pointerdown", micDown);
for (const ev of ["pointerup", "pointercancel", "pointerleave"]) $("mic").addEventListener(ev, micUp);
$("mic").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.repeat) micDown(e); });
$("mic").addEventListener("keyup", (e) => { if (e.key === "Enter") micUp(); });
const typing = (t) => t instanceof HTMLElement && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName));
// Space talks anywhere except while typing; in the empty ask field it still talks.
addEventListener("keydown", (e) => { if (e.code === "Space" && (!typing(e.target) || (e.target.id === "q" && !e.target.value))) { e.preventDefault(); if (!e.repeat) micDown(e); } });
addEventListener("keyup", (e) => { if (e.code === "Space" && held) { e.preventDefault(); micUp(); } });
addEventListener("blur", micUp);
$("q").addEventListener("keydown", (e) => { if (e.key === "Escape") { $("q").value = ""; $("q").blur(); } });
$("mic").addEventListener("contextmenu", (e) => e.preventDefault());

let busy = false;
function setBusy(b) { busy = b; for (const id of ["go", "q"]) $(id).disabled = b; for (const c of $("chips").children) c.disabled = b; }
$("ask").onsubmit = (e) => { e.preventDefault(); const t = $("q").value.trim(); $("q").value = ""; if (t && !busy) ask(t); };

const samples = ["Where can we go this Saturday?", "Is the closest zoo a good fit for us?", "Somewhere with animals on Sunday afternoon?"];
for (const label of samples) {
  const b = el("button", null, label); b.type = "button";
  b.onclick = () => { $("q").value = ""; ask(label); };
  $("chips").append(b);
}

icons();
connect().catch((e) => { status("Could not connect: " + e.message); $("conn-text").textContent = "offline"; });
document.fonts?.ready.then(() => { drawWires(); drawFlow(); });
</script>
